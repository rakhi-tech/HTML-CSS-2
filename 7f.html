<!DOCTYPE html>
<html>
<head>
  <title>LinkedIn Signup</title>
  <style>
    label {
      font-size: 14px;
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    input {
      width: 250px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    button {
      background-color: #0073b1; /* LinkedIn blue */
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    p {
      font-size: 12px;
      color: gray;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>LinkedIn Signup Example</h2>
  
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Email">
  
  <button>Agree & Join</button>
  
  <p>By clicking Agree & Join, you agree to the Privacy Policy.</p>
</body>
</html>
