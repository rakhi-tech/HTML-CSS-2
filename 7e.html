<!DOCTYPE html>
<html>
<head>
  <title>Textbox with Shadow</title>
  <style>
    input {
      width: 300px;
      padding: 10px;
      border: none; 
      box-shadow: 0px 2px 6px rgba(0,0,0,0.3); 
    }
  </style>
</head>
<body>
  <h2>Search Box Example</h2>
  <input type="text" placeholder="Search Google or type a URL">
</body>
</html>
